<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактирование поста</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0; padding: 16px; box-sizing: border-box;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }
    .toolbar {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .toolbar button, .link-row button {
      padding: 6px 12px;
      margin: 0;
      width: auto;
      font-size: 14px;
      font-weight: 600;
      background-color: var(--tg-theme-secondary-bg-color, #e0e0e0);
      color: var(--tg-theme-text-color, #000000);
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .toolbar button:hover, .link-row button:hover {
      opacity: 0.8;
    }
    .link-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .link-row input {
      flex: 1;
      min-width: 0;
      padding: 6px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000000);
      box-sizing: border-box;
    }
    textarea {
      width: 100%; height: 200px; padding: 12px;
      border: 1px solid #ccc; border-radius: 8px; font-size: 15px;
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000000); box-sizing: border-box;
      resize: vertical;
      font-family: inherit;
    }
    .counter {
      margin-top: 6px;
      font-size: 13px;
      color: var(--tg-theme-hint-color, #888);
      text-align: right;
    }
    .counter.over {
      color: #d32f2f;
      font-weight: 600;
    }
    .preview-container {
      margin-top: 14px;
      border: 1px dashed #aaa;
      border-radius: 8px;
      padding: 12px;
      background-color: var(--tg-theme-secondary-bg-color, #fafafa);
    }
    .preview-title {
      font-size: 12px;
      font-weight: bold;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    #preview-box {
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #status {
      margin-top: 12px;
      font-size: 14px;
      color: #d32f2f;
      min-height: 18px;
    }
    #save-btn {
      width: 100%; padding: 14px; margin-top: 8px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    #save-btn:disabled {
      opacity: 0.6; cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h3>Редактирование поста</h3>

  <!-- Панель быстрого форматирования тегов Telegram -->
  <div class="toolbar">
    <button type="button" onclick="insertTag('b')"><b>B</b></button>
    <button type="button" onclick="insertTag('i')"><i>I</i></button>
    <button type="button" onclick="insertTag('u')"><u>U</u></button>
    <button type="button" onclick="insertTag('s')"><s>S</s></button>
    <button type="button" onclick="insertTag('code')">&lt;/&gt;</button>
  </div>

  <div class="link-row">
    <input id="link-url" type="url" inputmode="url" placeholder="https://..." autocomplete="off">
    <button type="button" onclick="insertLink()">🔗 Вставить ссылку</button>
  </div>

  <textarea id="post-text" placeholder="Загрузка текста..." oninput="updatePreview()" disabled></textarea>
  <div id="counter" class="counter"></div>

  <!-- Блок живого превью -->
  <div class="preview-container">
    <div class="preview-title">Предпросмотр в Telegram:</div>
    <div id="preview-box"></div>
  </div>

  <div id="status"></div>
  <button id="save-btn" onclick="confirmAndSubmit()" disabled>Опубликовать в канал</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const N8N_BASE_URL = 'https://n8n.yeriho.top/webhook';
    const CAPTION_LIMIT = 1024;
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('post_id');
    const token = urlParams.get('t');

    const textarea = document.getElementById('post-text');
    const previewBox = document.getElementById('preview-box');
    const counterEl = document.getElementById('counter');
    const statusEl = document.getElementById('status');
    const saveBtn = document.getElementById('save-btn');

    let ready = false;    // текст загружен и доступ подтверждён
    let sending = false;  // идёт отправка

    // Разрешённые Telegram теги. Всё остальное из предпросмотра вычищается,
    // чтобы текст из LLM/YouTube не мог выполнить код в веб-аппе.
    const ALLOWED_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'INS', 'S', 'STRIKE', 'DEL', 'A', 'CODE', 'PRE']);

    function sanitize(html) {
      const tpl = document.createElement('template'); // содержимое template не исполняется
      tpl.innerHTML = html;
      (function walk(node) {
        Array.from(node.children).forEach(el => {
          if (!ALLOWED_TAGS.has(el.tagName)) {
            el.replaceWith(document.createTextNode(el.textContent));
            return;
          }
          Array.from(el.attributes).forEach(attr => {
            const isSafeHref = el.tagName === 'A' && attr.name === 'href' && /^https?:\/\//i.test(attr.value);
            if (!isSafeHref) el.removeAttribute(attr.name);
          });
          walk(el);
        });
      })(tpl.content);
      return tpl.innerHTML;
    }

    // Вставка тега вокруг выделения
    function insertTag(tag) {
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const selected = text.substring(start, end);
      const open = `<${tag}>`;
      const close = `</${tag}>`;

      textarea.value = text.substring(0, start) + open + selected + close + text.substring(end);
      textarea.focus();
      textarea.setSelectionRange(start + open.length, start + open.length + selected.length);
      updatePreview();
    }

    // Вставка ссылки: URL берётся из поля рядом с кнопкой (prompt() не везде работает в Telegram)
    function insertLink() {
      const urlInput = document.getElementById('link-url');
      const url = urlInput.value.trim();
      if (!/^https?:\/\//i.test(url)) {
        statusEl.textContent = 'Введите ссылку, которая начинается с http:// или https://';
        return;
      }
      statusEl.textContent = '';

      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const label = text.substring(start, end) || 'ссылка';
      const safeUrl = url.replace(/"/g, '&quot;');
      const replacement = `<a href="${safeUrl}">${label}</a>`;

      textarea.value = text.substring(0, start) + replacement + text.substring(end);
      textarea.focus();
      urlInput.value = '';
      updatePreview();
    }

    // Предпросмотр, счётчик символов и состояние кнопки
    function updatePreview() {
      previewBox.innerHTML = sanitize(textarea.value);

      const len = previewBox.textContent.length; // видимая длина без тегов
      counterEl.textContent = `${len} / ${CAPTION_LIMIT}`;
      counterEl.classList.toggle('over', len > CAPTION_LIMIT);

      saveBtn.disabled = !ready || sending || len === 0 || len > CAPTION_LIMIT;
    }

    function showFatal(message) {
      ready = false;
      textarea.value = '';
      textarea.disabled = true;
      textarea.placeholder = '';
      statusEl.textContent = message;
      updatePreview();
    }

    // Загрузка текста черновика (GET /get-arknights), нужен секрет t из ссылки кнопки
    async function loadPostData() {
      if (!postId || !token) {
        showFatal('Ссылка неполная. Откройте редактор кнопкой под постом в боте.');
        return;
      }

      try {
        const response = await fetch(
          `${N8N_BASE_URL}/get-sp?post_id=${encodeURIComponent(postId)}&t=${encodeURIComponent(token)}`
        );
        if (!response.ok) {
          throw new Error(`Ошибка сервера (${response.status})`);
        }

        const data = await response.json();
        const item = Array.isArray(data) ? data[0] : data;

        if (item && item.error === 'forbidden') {
          showFatal('Нет доступа к этому черновику. Он мог быть уже опубликован или отклонён.');
          return;
        }

        const text = item && item.text ? item.text : '';
        if (!text) {
          showFatal('Текст поста не найден. Возможно, черновик уже опубликован или удалён.');
          return;
        }

        textarea.value = text;
        textarea.disabled = false;
        ready = true;
        updatePreview();
      } catch (err) {
        console.error(err);
        showFatal('Не удалось загрузить текст: ' + err.message);
      }
    }

    loadPostData();

    // Подтверждение перед публикацией: кнопка публикует пост в канал сразу
    function confirmAndSubmit() {
      if (typeof tg.showConfirm === 'function') {
        tg.showConfirm('Опубликовать пост в канал?', ok => { if (ok) submitData(); });
      } else if (confirm('Опубликовать пост в канал?')) {
        submitData();
      }
    }

    // Публикация (POST /edit-arknights): отправляем текст и секрет черновика
    async function submitData() {
      sending = true;
      saveBtn.disabled = true;
      saveBtn.innerText = 'Публикация...';
      statusEl.textContent = '';

      try {
        const response = await fetch(`${N8N_BASE_URL}/edit-sp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            post_id: postId,
            t: token,
            text: textarea.value
          })
        });

        if (!response.ok) {
          throw new Error(`Ошибка сервера (${response.status})`);
        }

        tg.close();
      } catch (err) {
        statusEl.textContent = 'Не удалось опубликовать: ' + err.message;
        sending = false;
        saveBtn.innerText = 'Опубликовать в канал';
        updatePreview();
      }
    }
  </script>
</body>
</html>
