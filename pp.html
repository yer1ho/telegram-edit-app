<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактирование поста</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0; padding: 16px; box-sizing: border-box;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }
    .toolbar {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .toolbar button, .link-row button {
      padding: 6px 12px;
      margin: 0;
      width: auto;
      font-size: 14px;
      font-weight: 600;
      background-color: var(--tg-theme-secondary-bg-color, #e0e0e0);
      color: var(--tg-theme-text-color, #000000);
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .toolbar button:hover, .link-row button:hover {
      opacity: 0.8;
    }
    .link-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .link-row input {
      flex: 1;
      min-width: 0;
      padding: 6px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000000);
      box-sizing: border-box;
    }
    textarea {
      width: 100%; height: 200px; padding: 12px;
      border: 1px solid #ccc; border-radius: 8px; font-size: 15px;
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000000); box-sizing: border-box;
      resize: vertical;
      font-family: inherit;
    }
    .counter {
      margin-top: 6px;
      font-size: 13px;
      color: var(--tg-theme-hint-color, #888);
      text-align: right;
    }
    .counter.over {
      color: #d32f2f;
      font-weight: 600;
    }
    .preview-container {
      margin-top: 14px;
      border: 1px dashed #aaa;
      border-radius: 8px;
      padding: 12px;
      background-color: var(--tg-theme-secondary-bg-color, #fafafa);
    }
    .preview-title {
      font-size: 12px;
      font-weight: bold;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    #preview-img {
      display: none;
      width: 100%;
      height: auto;
      max-height: 320px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 10px;
      background-color: rgba(0,0,0,0.06);
    }
    #preview-box {
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #status {
      margin-top: 12px;
      font-size: 14px;
      color: #d32f2f;
      min-height: 18px;
    }
    #save-btn, #queue-btn {
      width: 100%; padding: 14px; margin-top: 8px;
      border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    #save-btn {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
    }
    #queue-btn {
      background-color: var(--tg-theme-secondary-bg-color, #e0e0e0);
      color: var(--tg-theme-text-color, #000000);
      border: 1px solid rgba(0,0,0,0.15);
    }
    #save-btn:disabled, #queue-btn:disabled {
      opacity: 0.6; cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h3>Редактирование поста</h3>

  <!-- Панель быстрого форматирования тегов Telegram -->
  <div class="toolbar">
    <button type="button" onclick="insertTag('b')"><b>B</b></button>
    <button type="button" onclick="insertTag('i')"><i>I</i></button>
    <button type="button" onclick="insertTag('u')"><u>U</u></button>
    <button type="button" onclick="insertTag('s')"><s>S</s></button>
    <button type="button" onclick="insertTag('code')">&lt;/&gt;</button>
  </div>

  <div class="link-row">
    <input id="link-url" type="url" inputmode="url" placeholder="https://..." autocomplete="off">
    <button type="button" onclick="insertLink()">🔗 Вставить ссылку</button>
  </div>

  <textarea id="post-text" placeholder="Загрузка текста..." oninput="updatePreview()" disabled></textarea>
  <div id="counter" class="counter"></div>

  <!-- Блок живого превью: картинка поста и подпись, как в канале -->
  <div class="preview-container">
    <div class="preview-title">Предпросмотр в Telegram:</div>
    <img id="preview-img" alt="Картинка поста" referrerpolicy="no-referrer">
    <div id="preview-box"></div>
  </div>

  <div id="status"></div>
  <button id="save-btn" onclick="confirmAndSubmit('now')" disabled>Опубликовать в канал</button>
  <button id="queue-btn" onclick="confirmAndSubmit('queue')" disabled>🕒 В очередь</button>

  <script>

    tg.expand();

    const N8N_BASE_URL = 'https://n8n.yeriho.top/webhook';
    const CAPTION_LIMIT = 1024;
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('post_id');
    const token = urlParams.get('t');

    const textarea = document.getElementById('post-text');
    const previewBox = document.getElementById('preview-box');
    const previewImg = document.getElementById('preview-img');
    const counterEl = document.getElementById('counter');
    const statusEl = document.getElementById('status');
    const saveBtn = document.getElementById('save-btn');
    const queueBtn = document.getElementById('queue-btn');

    const SAVE_LABEL = 'Опубликовать в канал';
    const QUEUE_LABEL = '🕒 В очередь';

    let ready = false;    // текст загружен и доступ подтверждён
    let sending = false;  // идёт отправка

    // Разрешённые Telegram теги. Всё остальное из предпросмотра вычищается,
    // чтобы текст из LLM/YouTube не мог выполнить код в веб-аппе.
    const ALLOWED_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'INS', 'S', 'STRIKE', 'DEL', 'A', 'CODE', 'PRE']);

    function sanitize(html) {
      const tpl = document.createElement('template'); // содержимое template не исполняется
      tpl.innerHTML = html;
