<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование поста</title>
    <!-- Официальная библиотека Telegram Web Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h3 {
            margin-top: 0;
            font-size: 18px;
        }
        textarea {
            width: 100%;
            flex-grow: 1;
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
            resize: none;
            box-sizing: border-box;
            outline: none;
        }
        textarea:focus {
            border-color: var(--tg-theme-button-color, #2481cc);
        }
    </style>
</head>
<body>
    <h3>Редактирование текста поста</h3>
    <textarea id="postText" placeholder="Введите новый текст..."></textarea>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем мини-апп на весь экран

        // Получаем параметры из URL (chat_id, message_id и текущий текст)
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chat_id');
        const messageId = urlParams.get('message_id');
        const encodedText = urlParams.get('text');

        // Подставляем текущий текст в textarea с декодированием
        if (encodedText) {
            document.getElementById('postText').value = decodeURIComponent(encodedText);
        }

        // Настраиваем главную кнопку Telegram внизу экрана
        tg.MainButton.text = "Сохранить изменения";
        tg.MainButton.color = "#2481cc";
        tg.MainButton.show();

        // По клику на главную кнопку отправляем данные на вебхук n8n
        tg.MainButton.onClick(function() {
            let newText = document.getElementById('postText').value;
            
            // ВАЖНО: сюда мы позже подставим URL вашего нового вебхука в n8n для приема правок
            const n8nWebhookUrl = 'https://ваш-домен-n8n.com/webhook/update-webapp-post';

            fetch(n8nWebhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    message_id: messageId,
                    text: newText
                })
            })
            .then(response => {
                tg.close(); // Закрываем Web App после успешной отправки
            })
            .catch(error => {
                alert('Ошибка сохранения: ' + error);
                tg.MainButton.enable();
            });

            tg.MainButton.disable();
            tg.MainButton.showProgress();
        });
    </script>
</body>
</html>
