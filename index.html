<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактирование поста</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0; padding: 16px; box-sizing: border-box;
    }
    textarea {
      width: 100%; height: 250px; padding: 12px;
      border: 1px solid #ccc; border-radius: 8px; font-size: 15px;
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000000); box-sizing: border-box;
      resize: vertical;
    }
    button {
      width: 100%; padding: 14px; margin-top: 16px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:disabled {
      opacity: 0.6; cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h3>Редактирование поста</h3>
  <textarea id="post-text" placeholder="Загрузка текста из таблицы..."></textarea>
  <button id="save-btn" onclick="submitData()">Сохранить и обновить</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Замени на свои реальные Production URL вебхуков в n8n
    const N8N_BASE_URL = 'https://95.182.114.206:8443/webhook/telegram-edit'; 

    // Читаем post_id из URL
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('post_id');

    // При открытии приложения подтягиваем текст из Google Sheets через n8n
    async function loadPostData() {
      if (!postId) {
        document.getElementById('post-text').value = "Ошибка: не передан post_id";
        return;
      }

      try {
        const response = await fetch(`${N8N_BASE_URL}/get-post?post_id=${postId}`);
        if (!response.ok) throw new Error('Не удалось получить данные');
        
        const data = await response.json();
        // Ожидаем, что n8n вернет объект с полем text
        const text = data.text || (Array.isArray(data) ? data[0]?.text : '');
        
        document.getElementById('post-text').value = text || '';
      } catch (err) {
        console.error(err);
        document.getElementById('post-text').placeholder = 'Ошибка загрузки текста';
      }
    }

    loadPostData();

    // Отправка отредактированного текста обратно в n8n
    async function submitData() {
      const newText = document.getElementById('post-text').value;
      const saveBtn = document.getElementById('save-btn');
      
      saveBtn.disabled = true;
      saveBtn.innerText = 'Сохранение...';

      try {
        const response = await fetch(`${N8N_BASE_URL}/telegram-edit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            post_id: postId,
            text: newText
          })
        });

        if (!response.ok) throw new Error('Ошибка сервера n8n');
        
        tg.close();
      } catch (err) {
        alert('Не удалось сохранить: ' + err.message);
        saveBtn.disabled = false;
        saveBtn.innerText = 'Сохранить и обновить';
      }
    }
  </script>
</body>
</html>
