<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактирование поста</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    h3 { margin-top: 0; }
    textarea {
      width: 100%;
      height: 220px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000000);
      box-sizing: border-box;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
  </style>
</head>
<body>
  <h3>Редактирование текста</h3>
  <textarea id="post-text" placeholder="Загрузка текста..."></textarea>
  <button id="save-btn" onclick="submitData()">Сохранить и обновить</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем окно на всю высоту

    // Ссылку на ваш Webhook в n8n вставим на Шаге 2
    const N8N_WEBHOOK_URL = 'https://95.182.114.206:8443/webhook/telegram-edit';

    // Получаем параметры из URL
    const urlParams = new URLSearchParams(window.location.search);
    const chatId = urlParams.get('chat_id');
    const messageId = urlParams.get('message_id');
    const initialText = urlParams.get('text') || '';

    // Подставляем текст в textarea
    document.getElementById('post-text').value = initialText;

    async function submitData() {
      const newText = document.getElementById('post-text').value;
      const saveBtn = document.getElementById('save-btn');
      
      saveBtn.disabled = true;
      saveBtn.innerText = 'Сохранение...';

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: chatId,
            message_id: messageId,
            text: newText
          })
        });

        if (response.ok) {
          tg.close(); // Закрываем Web App после успешной отправки
        } else {
          alert('Ошибка при сохранении!');
          saveBtn.disabled = false;
          saveBtn.innerText = 'Сохранить и обновить';
        }
      } catch (err) {
        alert('Ошибка сети: ' + err.message);
        saveBtn.disabled = false;
        saveBtn.innerText = 'Сохранить и обновить';
      }
    }
  </script>
</body>
</html>
