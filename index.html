<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактирование поста</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0; padding: 16px; box-sizing: border-box;
    }
    textarea {
      width: 100%; height: 250px; padding: 12px;
      border: 1px solid #ccc; border-radius: 8px; font-size: 15px;
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000000); box-sizing: border-box;
      resize: vertical;
    }
    button {
      width: 100%; padding: 14px; margin-top: 16px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:disabled {
      opacity: 0.6; cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h3>Редактирование поста</h3>
  <textarea id="post-text" placeholder="Загрузка текста из таблицы..."></textarea>
  <button id="save-btn" onclick="submitData()">Сохранить и обновить</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Базовый URL сервера n8n без конечных путей
    const N8N_BASE_URL = 'https://95.182.114.206:8443/webhook'; 

    // Читаем post_id из URL параметров
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('post_id');

    // При открытии приложения запрашиваем текст с воркфлоу чтения (GET /get-post)
    async function loadPostData() {
      const textarea = document.getElementById('post-text');

      if (!postId) {
        textarea.value = "Ошибка: параметр post_id не найден в URL";
        return;
      }

      try {
        const response = await fetch(`${N8N_BASE_URL}/get-post?post_id=${encodeURIComponent(postId)}`);
        
        if (!response.ok) {
          throw new Error(`Ошибка сервера (${response.status} ${response.statusText})`);
        }
        
        const data = await response.json();
        console.log("Полученные данные от n8n:", data);

        // Универсальное извлечение текста из ответа
        let text = '';
        if (Array.isArray(data) && data.length > 0) {
          text = data[0].text || data[0].content || data[0].message || '';
        } else if (data && typeof data === 'object') {
          text = data.text || data.content || data.message || '';
        }

        if (text) {
          textarea.value = text;
        } else {
          textarea.value = '';
          textarea.placeholder = 'Текст поста пуст или не найден в ответе';
        }
      } catch (err) {
        console.error(err);
        textarea.value = 'Не удалось загрузить текст: ' + err.message;
      }
    }

    loadPostData();

    // Отправка отредактированного текста на воркфлоу сохранения (POST /telegram-edit)
    async function submitData() {
      const newText = document.getElementById('post-text').value;
      const saveBtn = document.getElementById('save-btn');
      
      saveBtn.disabled = true;
      saveBtn.innerText = 'Сохранение...';

      try {
        const response = await fetch(`${N8N_BASE_URL}/telegram-edit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            post_id: postId,
            text: newText
          })
        });

        if (!response.ok) {
          throw new Error(`Ошибка сервера (${response.status})`);
        }
        
        tg.close();
      } catch (err) {
        alert('Не удалось сохранить: ' + err.message);
        saveBtn.disabled = false;
        saveBtn.innerText = 'Сохранить и обновить';
      }
    }
  </script>
</body>
</html>
